<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS EXTERNO -->
     <link rel="stylesheet" href="./src/css/estilo.css">
    <title>Loja Gamer</title>
</head>
<body>
    <header>
        <h1 class="logo">LOJA<span>GAMER</span></h1>
        <div class="menu-hamburguer" id="menu-icone">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav id="nav-menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>
    <!-- SLIDE SHOW -->
     <section id="banner">
        <img id="imgBanner">
     </section>



    <main class="container">
        <h2>Produtos em Destaques</h2>
        <section class="card">
            <div class="card-game">
                <img src="./src/assets/Carro4.png" alt="Produto1"/>
                <article class="card-content">
                    <h2>Produto 1</h2>
                    <p class="preco">R$ 300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
              <div class="card-game">
                <img src="./src/assets/Carro5.png" alt="Produto2"/>
                <article class="card-content">
                    <h2>Produto 2</h2>
                    <p class="preco">R$ 400,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
              <div class="card-game">
                <img src="./src/assets/Carro8.png" alt="Produto3"/>
                <article class="card-content">
                    <h2>Produto 3</h2>
                    <p class="preco">R$ 500,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy;-2026- LojaGamer-Direitos reservados</p>
    </footer>

    

    <!-- JS EXTERNO -->
     <script src="./src/js/script.js"></script>
</body>
</html>
